name: bootstrap-source

on:
  push:
    branches:
      - agent/multimodel-orchestrator-v1
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add K3-led multi-model orchestrator"
          git push origin HEAD:${GITHUB_REF_NAME}
