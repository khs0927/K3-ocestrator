[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k3-multimodel-orchestrator"
version = "0.6.0"
description = "Kimi K3-led coding orchestrator with DeepSeek, GLM, NVIDIA NIM and ACP/MCP routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "agent-client-protocol>=0.11,<0.12",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*", "browser_bridge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
